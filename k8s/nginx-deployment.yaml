apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: villa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

            - name: static-storage
              mountPath: /app/staticfiles
              readOnly: true

            - name: media-storage
              mountPath: /app/media
              readOnly: true

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc

        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc
